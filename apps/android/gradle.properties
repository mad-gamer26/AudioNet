org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Official builds may pre-fill the sign-in form's server (-PaudionetDefaultServer=https://...);
# nothing in the app depends on a particular server.
audionetDefaultServer=
# App-only rebuilds of the same AudioNet version (the version code's last
# two digits, see app/build.gradle.kts); back to 0 with each new version.
audionetBuild=1
