# XcodeGen spec for the native AudioNet iPhone and iPad app (SwiftUI on the
# Rust engine; no web view). Build the engine first, then:
#   apps/ios/build-core.sh && cd apps/ios && xcodegen generate
# Official builds may set AUDIONET_DEFAULT_SERVER (pre-filled at sign-in);
# nothing in the app depends on a particular server. The app icon is drawn
# by make-icon.py. The bundle ID is the one registered for the official
# App Store app; a build under another developer team needs its own.
name: AudioNet
options:
  bundleIdPrefix: com.matthewdovi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    AUDIONET_DEFAULT_SERVER: ""
    # The iPhone app has its own version, not the workspace's: it stays 1.0
    # (the App Store version being prepared), and each TestFlight upload
    # raises the build number instead. The engine inside reports the
    # workspace version as "Engine version".
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  AudioNet:
    type: application
    platform: iOS
    sources:
      - AudioNet
      - Shared
      - path: ../shared
      - path: Generated/audionet_ffi.swift
    info:
      path: AudioNet/Info.plist
      properties:
        CFBundleDisplayName: AudioNet
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Streams keep playing and recording with the screen locked.
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "AudioNet sends this iPhone's microphone to your other devices when you choose to."
        NSLocalNetworkUsageDescription: "AudioNet connects directly to your other devices on this network, for the best sound and least delay."
        AudioNetDefaultServer: "$(AUDIONET_DEFAULT_SERVER)"
        AudioNetKeychainGroup: "$(AppIdentifierPrefix)com.matthewdovi.AudioNet.shared"
        # The Live Activity: what is streaming, on the Lock Screen and in the
        # Dynamic Island, with Mute and Stop.
        NSSupportsLiveActivities: true
        # audionet://device/ID opens a device; audionet://listen/ID listens
        # to it (widgets, Shortcuts, NFC tags).
        CFBundleURLTypes:
          - CFBundleURLName: org.audionet.link
            CFBundleURLSchemes: [audionet]
        # Handoff with the Mac app: a stream being listened to continues on
        # the other device.
        NSUserActivityTypes: [org.audionet.listen]
        # Only standard, published encryption (ChaCha20-Poly1305, DTLS/SRTP
        # for WebRTC, TLS), which is exempt: builds skip Apple's
        # export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    # Push notifications (off until turned on in Settings), and the keychain
    # group the notification extension reads the notification key from.
    entitlements:
      path: AudioNet/AudioNet.entitlements
      properties:
        aps-environment: development
        keychain-access-groups: ["$(AppIdentifierPrefix)com.matthewdovi.AudioNet.shared"]
        # "Offline alerts break through Focus" (Settings, off by default).
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewdovi.AudioNet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # The engine is Rust with a C interface; UniFFI's generated Swift.
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - target: NotificationService
      - target: AudioNetWidgets
      - framework: Generated/AudioNetCore.xcframework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
  # The Live Activity's design, the Home and Lock Screen widgets, and the
  # Control Center controls. Actions run in the app (where the engine is).
  AudioNetWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: AudioNet
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The keychain group the app shares its device list in.
        AudioNetKeychainGroup: "$(AppIdentifierPrefix)com.matthewdovi.AudioNet.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/AudioNetWidgets.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.matthewdovi.AudioNet.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewdovi.AudioNet.Widgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: AUDIONET_EXTENSION
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
  # Decrypts AudioNet's notifications (the text is sealed for this iPhone).
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
      - Shared/SharedState.swift
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: AudioNet Notifications
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"
        AudioNetKeychainGroup: "$(AppIdentifierPrefix)com.matthewdovi.AudioNet.shared"
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.matthewdovi.AudioNet.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewdovi.AudioNet.NotificationService
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: WidgetKit.framework
  AudioNetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AudioNetUITests]
    dependencies:
      - target: AudioNet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewdovi.AudioNetUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  AudioNet:
    build:
      targets:
        AudioNet: all
        AudioNetUITests: [test]
    test:
      targets: [AudioNetUITests]
