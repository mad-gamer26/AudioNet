# XcodeGen spec for the native AudioNet iPhone and iPad app (SwiftUI on the
# Rust engine; no web view). Build the engine first, then:
#   apps/ios/build-core.sh && cd apps/ios && xcodegen generate
# Official builds may set AUDIONET_DEFAULT_SERVER (pre-filled at sign-in);
# nothing in the app depends on a particular server.
name: AudioNet
options:
  bundleIdPrefix: org.audionet
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    AUDIONET_DEFAULT_SERVER: ""
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AudioNet:
    type: application
    platform: iOS
    sources:
      - AudioNet
      - path: ../shared
      - path: Generated/audionet_ffi.swift
    info:
      path: AudioNet/Info.plist
      properties:
        CFBundleDisplayName: AudioNet
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Streams keep playing and recording with the screen locked.
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "AudioNet sends this iPhone's microphone to your other devices when you choose to."
        NSLocalNetworkUsageDescription: "AudioNet connects directly to your other devices on this network, for the best sound and least delay."
        AudioNetDefaultServer: "$(AUDIONET_DEFAULT_SERVER)"
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.audionet.AudioNet
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # The engine is Rust with a C interface; UniFFI's generated Swift.
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - framework: Generated/AudioNetCore.xcframework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
  AudioNetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AudioNetUITests]
    dependencies:
      - target: AudioNet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.audionet.AudioNetUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  AudioNet:
    build:
      targets:
        AudioNet: all
        AudioNetUITests: [test]
    test:
      targets: [AudioNetUITests]
