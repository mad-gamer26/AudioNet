# The checks every change must pass (CONTRIBUTING.md): format, lints with
# warnings as errors, and the tests, on Linux, Windows and macOS. Tests that
# need a live server or run for an hour are ignored by default.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux audio headers (ALSA, for cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      # The audio simulation suite (tests/sim.rs) is pure computation: it
      # gives the same results everywhere, so it runs on Linux only.
      - name: Tests (everything)
        if: runner.os == 'Linux'
        run: cargo test --all-targets
      - name: Tests (all but the simulation suite)
        if: runner.os != 'Linux'
        run: cargo test --workspace --lib --bins --test list_output --test device_loss --test native_devices --test sign_up --test signaling
