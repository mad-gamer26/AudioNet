# coturn configuration for AudioNet (example). /etc/turnserver.conf
# Replace the addresses, realm and secret. The secret must equal
# AUDIONET_TURN_SECRET in /etc/audionet/audionet.env.

listening-port=3478
tls-listening-port=5349
# The server's public address (and private address if it is behind NAT:
# external-ip=PUBLIC/PRIVATE).
listening-ip=203.0.113.10
relay-ip=203.0.113.10
external-ip=203.0.113.10
min-port=49160
max-port=49359

realm=audionet.example.com
use-auth-secret
static-auth-secret=replace-with-the-same-secret
fingerprint
stale-nonce=600

# TLS for turns: (5349). Keep a copy of the certificate readable by the
# turnserver user; see deploy/coturn/certbot-deploy-hook.sh.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# Never relay into private networks (prevents using TURN to reach internal hosts).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-cli
total-quota=200
syslog
simple-log
