# /etc/nginx/conf.d/audionet.mad-gamer.com.conf on the official instance.
# Follows that server's conventions: shared wildcard TLS snippet and
# proxy snippet, and the $connection_upgrade map defined in nginx.conf.

server {
    listen 80;
    listen [::]:80;
    server_name audionet.mad-gamer.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name audionet.mad-gamer.com;

    include /etc/nginx/snippets/ssl-wildcard.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    # This server's nginx.conf strips upstream security headers from every
    # proxied app. AudioNet sets its own strict ones (CSP, frame, referrer,
    # permissions), so pass them through for this site only.
    proxy_pass_header Content-Security-Policy;
    proxy_pass_header X-Frame-Options;
    proxy_pass_header X-Content-Type-Options;
    proxy_pass_header Referrer-Policy;
    proxy_pass_header Permissions-Policy;

    # Signaling WebSocket: long-lived upgraded connection.
    location = /api/v1/ws {
        proxy_pass http://127.0.0.1:8740;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # proxy-common.conf sets a 90 s read timeout; the server pings every
        # 20 s, so idle signaling connections stay open.
    }

    location / {
        proxy_pass http://127.0.0.1:8740;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
