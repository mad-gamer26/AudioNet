# nginx virtual host for an AudioNet server (example).
# Replace audionet.example.com and the certificate paths, place in
# /etc/nginx/conf.d/ (or sites-available + sites-enabled), run `nginx -t`,
# then reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name audionet.example.com;
    return 301 https://$host$request_uri;
}

# Needed once per nginx instance (skip if your nginx.conf already has it):
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name audionet.example.com;

    ssl_certificate     /etc/letsencrypt/live/audionet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audionet.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    # Signaling WebSocket: long-lived, upgraded connection.
    location = /api/v1/ws {
        proxy_pass http://127.0.0.1:8740;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # API and web client.
    location / {
        proxy_pass http://127.0.0.1:8740;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The client's address, for the sign-up limit (client_address_header).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
